# Copy to .github/workflows/ci.yml in the public overgrant repo.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --extra dev pytest -q
      - run: uv run --python 3.12 --extra dev ruff check .
      - run: uv run --python 3.12 overgrant scan . --fail-on low   # dogfood
