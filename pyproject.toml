[project]
name = "overgrant"
version = "0.1.0"
description = "Local security scan of AI coding-agent setups (Claude Code, Codex, Cursor, MCP)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["security", "linter", "claude-code", "codex", "cursor", "mcp", "ai-agents"]
dependencies = []

[project.urls]
Homepage = "https://github.com/overgrant/overgrant"
Issues = "https://github.com/overgrant/overgrant/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
overgrant = "overgrant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S311", "S603", "S607"]  # fake tokens; fixed-argv local CLIs
